name: Build GeckoView spike APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'spike-geckoview/**'
      - '.github/workflows/build-geckoview-spike.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Resolve a GeckoView release compatible with AGP 8.5 / compileSdk 34
        run: |
          META=$(curl -s https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-omni/maven-metadata.xml)
          VERS=$(printf '%s' "$META" | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p')
          echo "versions found: $(printf '%s\n' "$VERS" | wc -l)"
          VER=$(printf '%s\n' "$VERS" | awk -F. '$1+0<=126' | tail -1)
          if [ -z "$VER" ]; then VER=$(printf '%s\n' "$VERS" | head -1); fi
          echo "GeckoView version: $VER"
          echo "GECKOVIEW_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build spike APK
        run: gradle -p spike-geckoview assembleDebug --no-daemon --stacktrace

      - name: Upload spike APK
        uses: actions/upload-artifact@v4
        with:
          name: aekant-geckoview-spike-apk
          path: spike-geckoview/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
