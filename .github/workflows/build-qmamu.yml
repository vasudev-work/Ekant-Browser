name: Build Qmamu Search APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'qmamu-search/**'
      - '.github/workflows/build-qmamu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qmamu-search
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/QmamuSearch-debug.apk"

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: qmamu-debug-apk
          path: QmamuSearch-debug.apk
          if-no-files-found: error

      - name: Publish / update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qmamu-latest
          name: Qmamu Search (latest)
          make_latest: false
          body: |
            Qmamu Search opens the Qmamu search engine in a full-screen WebView,
            keeps every link in the app, refreshes on pull-down and shows a Retry
            screen when the device is offline.

            ## Install
            ```
            adb install QmamuSearch-debug.apk
            ```
            Or copy `QmamuSearch-debug.apk` to the phone, open it and allow
            "install unknown apps".

            Debug-signed build for sideloading/testing.
          files: QmamuSearch-debug.apk
