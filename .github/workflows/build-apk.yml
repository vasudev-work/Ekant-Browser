name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID SDK: $SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aekant-debug.apk

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aekant-debug-apk
          path: Aekant-debug.apk
          if-no-files-found: error

      - name: Publish / update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aekant for Android (latest)
          make_latest: true
          body: |
            Latest debug APK, built automatically by CI on every push.

            ## Install
            ```
            adb install Aekant-debug.apk
            ```
            Or copy `Aekant-debug.apk` to the phone, open it and allow "install unknown apps".

            Debug-signed build for sideloading/testing.
          files: Aekant-debug.apk
