name: Store check

on:
  push:
    paths:
      - 'extensions/**'
      - 'tools/validate.js'
      - '.github/workflows/store-check.yml'
  pull_request:
    paths:
      - 'extensions/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Every extension file must be listed, present, parse, and match the
      # sha256 the index publishes - otherwise the browser will refuse it.
      - name: Validate the extension index
        run: node tools/validate.js
