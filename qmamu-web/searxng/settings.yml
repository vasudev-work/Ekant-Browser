# Minimal SearXNG settings for Qmamu.
# The only thing that really matters here is enabling the json format, which the
# Qmamu backend uses. Everything else is SearXNG's own defaults.
use_default_settings: true

server:
  secret_key: "change-this-to-a-long-random-string"
  limiter: false          # personal use, single client
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json                # <- required by the Qmamu backend

ui:
  static_use_hash: true

engines:
  # the engines the Qmamu frontend exposes; SearXNG keeps its own defaults too
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: yandex
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
