plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qmamu.search'
    compileSdk 34

    defaultConfig {
        applicationId "com.qmamu.search"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin 1.8 merged the jdk7/jdk8 artefacts into the main stdlib, so mixing
    // kotlin-stdlib 1.8.x with kotlin-stdlib-jdk8 1.6.x trips the duplicate-class
    // check. The BOM keeps all three on one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
