<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aekant</title>
<style>
  :root{--bg:#0B0E12;--surf:#161B21;--surf2:#1E242C;--fg:#F2F4F7;--mut:#9BA3AE;--brand:#FF6600;--line:#262C34}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);-webkit-user-select:none;
    font-family:-apple-system,Roboto,"Segoe UI",Arial,sans-serif}
  a{color:inherit}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
  .ic{width:26px;height:26px}
  .badge{display:flex;align-items:center;gap:14px}
  .count{min-width:28px;height:28px;padding:0 5px;border-radius:10px;border:1.7px solid var(--fg);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
  .modes{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:17px;text-decoration:none}
  .pill{display:flex;align-items:center;gap:9px;border:1.7px solid var(--fg);border-radius:24px;
    padding:10px 22px;font-weight:700;font-size:15px;text-decoration:none}
  .mute{width:44px;height:44px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;
    justify-content:center;text-decoration:none}
  form{margin:20px 18px 4px}
  .search{display:flex;align-items:center;gap:11px;background:var(--surf2);border-radius:28px;padding:15px 18px}
  .search input{flex:1;background:transparent;border:0;outline:none;color:var(--fg);font-size:16px;
    -webkit-user-select:text}
  .search input::placeholder{color:var(--mut)}
  .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;padding:22px 16px 6px}
  .sc a{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;font-size:12px;overflow:hidden}
  .tile{width:58px;height:58px;border-radius:18px;background:var(--surf2);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:21px}
  .tile.add{color:var(--mut);font-size:28px;font-weight:400}
  .lab{max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .greet{padding:0 20px 6px}
  .g1{font-size:20px;font-weight:700}
  .g2{font-size:12px;color:var(--mut)}
  .rec-title{padding:10px 18px 6px;color:var(--mut);font-size:12px}
  .rec{display:flex;flex-direction:column;gap:6px;padding:0 18px 30px}
  .rec a{text-decoration:none;font-size:13px;background:var(--surf);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stats{display:none}
</style></head>
<body>
  <div class="top">
    <a href="aekant://home" aria-label="Home">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10.6 12 4l8 6.6"/><path d="M6.5 10v9h11v-9"/>
      </svg>
    </a>
    <div class="badge">
      <a href="aekant://tabs" style="text-decoration:none"><span class="count" id="tabcount">1</span></a>
      <a href="aekant://menu" aria-label="Menu">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="modes">
    <a href="aekant://containers" class="avatar" id="avatar">A</a>
    <a href="aekant://containers" class="pill" id="modepill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><path d="M12 7.5v4.8l3 2"/>
      </svg>
      <span id="modename">Personal</span>
    </a>
    <a href="aekant://mute" class="mute" aria-label="Mute">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3l5 4V5.5l-5 4H4z"/><path d="M16.5 9.5 21 15M21 9.5 16.5 15"/>
      </svg>
    </a>
  </div>

  <div class="greet" id="greet" style="display:none">
    <div class="g1" id="g1"></div>
    <div class="g2">Browse at your pace</div>
  </div>

  <form action="aekant://search" method="get" autocomplete="off">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="M16.2 16.2 20.5 20.5"/></svg>
      <input name="q" id="q" placeholder="Search or type URL" autocomplete="off">
      <a href="aekant://voice" aria-label="Voice search" style="display:flex">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </a>
    </div>
  </form>

  <div class="sc" id="topsites">
    <a href="aekant://open?u=https%3A%2F%2Fwww.google.com"><span class="tile">G</span><span class="lab">Google</span></a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.youtube.com"><span class="tile">&#9654;</span><span class="lab">YouTube</span></a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.wikipedia.org"><span class="tile">W</span><span class="lab">Wikipedia</span></a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.flipkart.com"><span class="tile">F</span><span class="lab">Flipkart</span></a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.amazon.in"><span class="tile">a</span><span class="lab">Amazon</span></a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.instagram.com"><span class="tile">I</span><span class="lab">Instagram</span></a>
    <a href="aekant://tools"><span class="tile">T</span><span class="lab">Tools</span></a>
    <a href="aekant://addshortcut"><span class="tile add">+</span><span class="lab">Add Site</span></a>
  </div>

  <div id="recent-wrap" style="display:none">
    <div class="rec-title">Recently visited</div>
    <div class="rec" id="recent"></div>
  </div>

<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var root = document.documentElement;
    function setv(name, key) { var v = p.get(key); if (v) root.style.setProperty(name, v.charAt(0) === '#' ? v : '#' + v); }
    setv('--bg', 'tbg'); setv('--surf', 'tsurf'); setv('--fg', 'tfg');
    setv('--mut', 'tmut'); setv('--brand', 'tbrand'); setv('--line', 'tmut');

    var mode = p.get('mode'); if (mode) {
      document.getElementById('modename').textContent = mode;
      document.getElementById('avatar').textContent = (mode.charAt(0) || 'A').toUpperCase();
    }
    var tc = p.get('tabs'); if (tc) document.getElementById('tabcount').textContent = tc;

    if (p.get('greet') !== '0') {
      var hr = new Date().getHours();
      document.getElementById('g1').textContent = hr < 12 ? 'Good morning' : (hr < 17 ? 'Good afternoon' : 'Good evening');
      document.getElementById('greet').style.display = 'block';
    }

    var ts = document.getElementById('topsites');
    var style = p.get('style') || 'personal';
    var sc = p.get('shortcuts');
    if (p.get('topsites') === '0' || style === 'minimal') {
      ts.style.display = 'none';
    } else if (sc) {
      ts.innerHTML = '';
      sc.split(';;').filter(function (x) { return x.trim().length > 0; }).forEach(function (it) {
        var parts = it.split('|');
        var n = (parts[0] || '').trim();
        var u = parts.slice(1).join('|');
        if (!u) return;
        var a = document.createElement('a');
        a.href = 'aekant://open?u=' + encodeURIComponent(u);
        var d = document.createElement('span'); d.className = 'tile'; d.textContent = (n.charAt(0) || '#').toUpperCase();
        var l = document.createElement('span'); l.className = 'lab'; l.textContent = n;
        a.appendChild(d); a.appendChild(l); ts.appendChild(a);
      });
      var add = document.createElement('a');
      add.href = 'aekant://addshortcut';
      var ad = document.createElement('span'); ad.className = 'tile add'; ad.textContent = '+';
      var al = document.createElement('span'); al.className = 'lab'; al.textContent = 'Add Site';
      add.appendChild(ad); add.appendChild(al); ts.appendChild(add);
    }

    var rec = p.get('recent');
    if (rec && p.get('show_recent') === '1' && style === 'dashboard') {
      var r = rec.split(';;').filter(function (x) { return x.trim().length > 0; });
      if (r.length) {
        document.getElementById('recent-wrap').style.display = 'block';
        var box = document.getElementById('recent');
        r.forEach(function (it) {
          var parts = it.split('|');
          var n = (parts[0] || '').trim();
          var u = parts.slice(1).join('|');
          if (!u) return;
          var a = document.createElement('a');
          a.href = 'aekant://open?u=' + encodeURIComponent(u);
          a.textContent = n || u;
          box.appendChild(a);
        });
      }
    }
  })();
</script>
</body></html>
