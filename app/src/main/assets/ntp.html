<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aekant</title>
<style>
  :root{
    --bg:#0B0E12; --surf:#161B21; --surf2:#1E242C;
    --fg:#F2F4F7; --mut:#9BA3AE; --brand:#FF6600; --line:#262C34;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,Roboto,"Segoe UI",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:44px 22px 30px;text-align:center}
  body.nobg{background:var(--bg)}
  .brand{display:flex;align-items:center;gap:12px;color:var(--fg)}
  .logo{width:44px;height:44px;border-radius:13px;background:#FF6600;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
  .wordmark{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;
    color:var(--brand)}
  .flag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--brand);
    font-weight:700;margin-bottom:14px}
  .sub{margin:12px 0 22px;font-size:13px;color:var(--mut)}
  .greet{margin:0 0 20px}
  .g1{font-size:21px;font-weight:700;color:var(--fg);margin-bottom:4px}
  .g2{font-size:13px;color:var(--mut)}
  form{width:100%;max-width:520px}
  input{width:100%;height:56px;border-radius:22px;border:1px solid var(--line);
    background:var(--surf);color:var(--fg);padding:0 22px;font-size:15px;outline:none}
  input::placeholder{color:var(--mut)}
  input:focus{border-color:var(--brand)}
  .stats{display:flex;gap:10px;margin:20px 0 2px;width:100%;max-width:520px}
  .stat{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
  .stat b{display:block;font-size:16px;color:var(--brand)}
  .stat span{font-size:10.5px;color:var(--mut)}
  .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;
    width:100%;max-width:520px;margin:24px 0 10px}
  .sc a{display:flex;flex-direction:column;align-items:center;gap:8px;
    text-decoration:none;color:var(--mut);font-size:11px;overflow:hidden}
  .dot{width:48px;height:48px;border-radius:16px;background:var(--surf2);
    display:flex;align-items:center;justify-content:center;
    color:var(--fg);font-weight:700;font-size:17px}
  .rec-title{width:100%;max-width:520px;text-align:left;color:var(--mut);font-size:12px;
    margin:26px 0 8px}
  .rec{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
  .rec a{display:block;text-align:left;text-decoration:none;color:var(--fg);font-size:13px;
    background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 14px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{margin-top:22px;font-size:11px;color:var(--mut);line-height:1.6}
</style></head>
<body>
  <div class="flag">India&rsquo;s Sovereign Browser</div>
  <div class="brand">
    <span class="logo">&#2309;</span>
    <span class="wordmark">Aekant</span>
  </div>
  <div class="sub">Private, fast and secure browsing &middot; local-only data</div>

  <div class="greet" id="greet" style="display:none">
    <div class="g1" id="g1"></div>
    <div class="g2">Browse at your pace</div>
  </div>

  <form action="aekant://search" method="get" autocomplete="off">
    <input name="q" placeholder="Search or type a URL" autofocus>
  </form>

  <div class="stats" id="stats">
    <div class="stat"><b>On</b><span>Shields</span></div>
    <div class="stat"><b>On</b><span>Ad blocker</span></div>
    <div class="stat"><b>Local</b><span>Storage</span></div>
  </div>

  <div class="sc" id="topsites">
    <a href="aekant://open?u=https%3A%2F%2Faekant.com"><span class="dot">A</span>Aekant</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.google.com"><span class="dot">G</span>Google</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.youtube.com"><span class="dot">&#9654;</span>YouTube</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.wikipedia.org"><span class="dot">W</span>Wikipedia</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.flipkart.com"><span class="dot">F</span>Flipkart</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.amazon.in"><span class="dot">a</span>Amazon</a>
    <a href="aekant://tools"><span class="dot">T</span>Tools</a>
    <a href="aekant://open?u=https%3A%2F%2Fwww.instagram.com"><span class="dot">I</span>Instagram</a>
  </div>

  <div id="recent-wrap" style="display:none;width:100%;max-width:520px">
    <div class="rec-title">Recently visited</div>
    <div class="rec" id="recent"></div>
  </div>

  <div class="foot">Aekant &middot; Made in Bharat<br/>Developed by Vasudev Danganya</div>

<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var root = document.documentElement;
    function setv(name, key) {
      var v = p.get(key);
      if (v) root.style.setProperty(name, v.charAt(0) === '#' ? v : '#' + v);
    }
    setv('--bg', 'tbg');
    setv('--surf', 'tsurf');
    setv('--fg', 'tfg');
    setv('--mut', 'tmut');
    setv('--brand', 'tbrand');
    setv('--line', 'tmut');

    if (p.get('bg') === '0') document.body.classList.add('nobg');

    if (p.get('greet') !== '0') {
      var hr = new Date().getHours();
      var msg = hr < 12 ? 'Good morning' : (hr < 17 ? 'Good afternoon' : 'Good evening');
      document.getElementById('g1').textContent = msg;
      document.getElementById('greet').style.display = 'block';
    }

    var style = p.get('style') || 'personal';
    var showStats = (p.get('stats') !== '0') && (style === 'dashboard');
    if (!showStats) document.getElementById('stats').style.display = 'none';

    var ts = document.getElementById('topsites');
    var sc = p.get('shortcuts');
    if (p.get('topsites') === '0' || style === 'minimal') {
      ts.style.display = 'none';
    } else if (sc) {
      var items = sc.split(';;').filter(function (x) { return x.trim().length > 0; });
      ts.innerHTML = '';
      items.forEach(function (it) {
        var parts = it.split('|');
        var n = (parts[0] || '').trim();
        var u = parts.slice(1).join('|');
        if (!u) return;
        var a = document.createElement('a');
        a.href = 'aekant://open?u=' + encodeURIComponent(u);
        var d = document.createElement('span');
        d.className = 'dot';
        d.textContent = (n.charAt(0) || '#').toUpperCase();
        a.appendChild(d);
        a.appendChild(document.createTextNode(n));
        ts.appendChild(a);
      });
    }

    var rec = p.get('recent');
    if (rec && p.get('show_recent') === '1' && style === 'dashboard') {
      var r = rec.split(';;').filter(function (x) { return x.trim().length > 0; });
      if (r.length) {
        document.getElementById('recent-wrap').style.display = 'block';
        var box = document.getElementById('recent');
        r.forEach(function (it) {
          var parts = it.split('|');
          var n = (parts[0] || '').trim();
          var u = parts.slice(1).join('|');
          if (!u) return;
          var a = document.createElement('a');
          a.href = 'aekant://open?u=' + encodeURIComponent(u);
          a.textContent = n || u;
          box.appendChild(a);
        });
      }
    }
  })();
</script>
</body></html>
